{% extends 'base.html' %}
{% block title %}Editar Producto - Js Glitz{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-4 bg-dark text-light shadow-lg border-secondary">
      <h3 class="text-center mb-4 text-light">✏️ Editar Producto</h3>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label text-light">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
            {% endif %}
          </div>
        {% endfor %}
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-success px-4">💾 Actualizar</button>
          <a href="{% url 'lista_productos' %}" class="btn btn-secondary ms-2">↩ Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
