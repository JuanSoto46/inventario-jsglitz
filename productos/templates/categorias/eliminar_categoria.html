{% extends 'base.html' %}
{% block title %}Eliminar Categoría - Js Glitz{% endblock %}
{% block content %}

<div class="d-flex justify-content-center align-items-center">
  <div class="card shadow-lg border-danger" style="max-width: 600px; width: 100%;">
    <div class="card-header bg-danger text-white">
      <h4 class="mb-0">
        <i class="bi bi-exclamation-triangle-fill"></i> Confirmar eliminación
      </h4>
    </div>

    <div class="card-body text-center">
      <p class="fs-5 mb-3">
        ¿Seguro que deseas eliminar la categoría
        <strong class="text-danger">“{{ categoria.nombre }}”</strong>?
      </p>
      <p class="text-muted">Esta acción no se puede deshacer.</p>

      <form method="post" class="mt-3 d-flex justify-content-center gap-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash-fill"></i> Sí, eliminar
        </button>
        <a href="{% url 'lista_categorias' %}" class="btn btn-secondary px-4">
          <i class="bi bi-x-circle"></i> Cancelar
        </a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
